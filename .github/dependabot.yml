version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    cooldown:
      default-days: 7
    schedule:
      interval: 'monthly'
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
  - package-ecosystem: 'bundler'
    directory: '/'
    cooldown:
      default-days: 7
    schedule:
      interval: 'monthly'
    groups:
      bundler:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
